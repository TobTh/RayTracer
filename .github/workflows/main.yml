name: CI
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      # `uv run` transparently creates/uses the project's .venv and installs
      # the locked dependencies before executing the command, so there is no
      # need to manually create or activate a virtualenv in this workflow.
      - name: Run Ruff (lint)
        run: uv run ruff check --output-format=github .
      - name: Test with pytest
        run: uv run pytest
      - name: Run mypy
        run: uv run mypy src tests

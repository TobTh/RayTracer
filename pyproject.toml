[project]
name = "raytracer"
version = "0.1.0"
description = "A simple ray tracer project"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "matplotlib",
    "pytest",
    "tqdm",
    "requests",
    "pydantic>=2.13.4",
    "networkx>=3.6.1",
]

[project.scripts]
raytracer = "Raytracer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
